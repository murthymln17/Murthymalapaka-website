<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Architecture for an enterprise intelligence the organization can own</title>
  <desc id="desc">Six connected layers: open-weight reasoning model, enterprise context, elimination-led reasoning framework, governed agents and tools, verified outcomes, and an enterprise learning loop feeding back into context and reasoning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#162235" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c627a"/>
    </marker>
    <style>
      .title { font: 600 33px Inter, Arial, sans-serif; fill: #17243a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #617087; }
      .box-title { font: 600 21px Inter, Arial, sans-serif; fill: #17243a; }
      .box-copy { font: 400 16px Inter, Arial, sans-serif; fill: #506078; }
      .step { font: 600 15px Inter, Arial, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #4c627a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">An Enterprise Intelligence the Organization Can Own</text>
  <text x="600" y="94" text-anchor="middle" class="subtitle">Model capability becomes enterprise intelligence through context, purpose, action and learning</text>

  <path class="arrow" d="M600 208 L600 246"/>
  <path class="arrow" d="M600 358 L600 396"/>
  <path class="arrow" d="M600 508 L600 546"/>
  <path class="arrow" d="M600 658 L600 696"/>

  <g filter="url(#shadow)">
    <rect x="270" y="122" width="660" height="86" rx="16" fill="#ffffff" stroke="#8090a4" stroke-width="2"/>
    <circle cx="320" cy="165" r="23" fill="#64748b"/>
    <text x="320" y="171" text-anchor="middle" class="step">1</text>
    <text x="360" y="157" class="box-title">Open-weight reasoning model</text>
    <text x="360" y="184" class="box-copy">Mistral or Qwen • controllable and replaceable reasoning foundation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="272" width="660" height="86" rx="16" fill="#ffffff" stroke="#427ea6" stroke-width="2"/>
    <circle cx="320" cy="315" r="23" fill="#427ea6"/>
    <text x="320" y="321" text-anchor="middle" class="step">2</text>
    <text x="360" y="307" class="box-title">Enterprise context</text>
    <text x="360" y="334" class="box-copy">RAG • telemetry • transactions • topology • operational history</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="422" width="660" height="86" rx="16" fill="#fffaf0" stroke="#c58a28" stroke-width="3"/>
    <circle cx="320" cy="465" r="23" fill="#c58a28"/>
    <text x="320" y="471" text-anchor="middle" class="step">3</text>
    <text x="360" y="457" class="box-title">Elimination-led reasoning framework</text>
    <text x="360" y="484" class="box-copy">Eliminate unnecessary demand first • automate necessary work second</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="572" width="660" height="86" rx="16" fill="#ffffff" stroke="#427ea6" stroke-width="2"/>
    <circle cx="320" cy="615" r="23" fill="#427ea6"/>
    <text x="320" y="621" text-anchor="middle" class="step">4</text>
    <text x="360" y="607" class="box-title">Governed agents and enterprise tools</text>
    <text x="360" y="634" class="box-copy">Investigate • test hypotheses • recommend • execute within controls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="722" width="660" height="86" rx="16" fill="#ffffff" stroke="#398163" stroke-width="2"/>
    <circle cx="320" cy="765" r="23" fill="#398163"/>
    <text x="320" y="771" text-anchor="middle" class="step">5</text>
    <text x="360" y="757" class="box-title">Verified operational and business outcomes</text>
    <text x="360" y="784" class="box-copy">Validate the intervention • measure recurrence, service and economic impact</text>
  </g>

  <path d="M930 765 C1080 765 1080 315 930 315" fill="none" stroke="#7a55a2" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <rect x="952" y="491" width="188" height="86" rx="14" fill="#f7f1fc" stroke="#7a55a2" stroke-width="2"/>
  <text x="1046" y="523" text-anchor="middle" class="box-title" style="font-size:18px">Enterprise</text>
  <text x="1046" y="548" text-anchor="middle" class="box-title" style="font-size:18px">learning loop</text>
  <text x="1046" y="569" text-anchor="middle" class="box-copy" style="font-size:13px">Outcomes improve context</text>

  <text x="600" y="860" text-anchor="middle" class="subtitle">The model supplies capacity. The enterprise supplies evidence. Eliminate First supplies purpose.</text>
</svg>
