<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc">
  <title id="title">AI-native operations: growth without proportional headcount</title>
  <desc id="desc">Comparison of a traditional and an AI-native six-customer delivery model, showing delivery FTEs, cost and contribution, followed by the operating-leverage flywheel: lower unit cost leads to more competitive pricing, more customer wins, more volume through the shared platform, more operational learning, and greater elimination, prevention and agentic coverage, which lowers unit cost again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f6"/>
      <stop offset="1" stop-color="#eef1ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b1f2a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c627a"/>
    </marker>
    <style>
      .title { font: 600 32px Inter, Arial, sans-serif; fill: #1B1F2A; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #5B6270; }
      .panel-head { font: 600 20px Inter, Arial, sans-serif; fill: #ffffff; }
      .row-label { font: 400 16px Inter, Arial, sans-serif; fill: #1B1F2A; }
      .row-value { font: 600 16px Inter, Arial, sans-serif; fill: #1B1F2A; }
      .row-value-hi-t { font: 700 20px Inter, Arial, sans-serif; fill: #3B4551; }
      .row-value-hi-a { font: 700 20px Inter, Arial, sans-serif; fill: #123F3C; }
      .caption { font: 500 18px Inter, Arial, sans-serif; fill: #1B1F2A; }
      .flywheel-title { font: 600 26px Inter, Arial, sans-serif; fill: #1B1F2A; }
      .node-num { font: 700 14px Inter, Arial, sans-serif; fill: #ffffff; }
      .node-text { font: 600 15px Inter, Arial, sans-serif; fill: #1B1F2A; }
      .center-text { font: 600 15px Inter, Arial, sans-serif; fill: #ffffff; }
      .foot { font: 400 15px Inter, Arial, sans-serif; fill: #5B6270; }
    </style>
  </defs>

  <rect width="1200" height="1620" fill="url(#bg)"/>

  <text x="600" y="46" text-anchor="middle" class="title">Growth No Longer Requires Proportional Headcount</text>
  <text x="600" y="76" text-anchor="middle" class="subtitle">Illustrative six-customer shared-services scenario</text>

  <!-- Traditional panel -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="520" height="380" rx="18" fill="#ffffff" stroke="#52606D" stroke-width="2"/>
    <path d="M60,128 a18,18 0 0 1 18,-18 h484 a18,18 0 0 1 18,18 v38 h-520 z" fill="#52606D"/>
    <text x="320" y="153" text-anchor="middle" class="panel-head">Traditional Model</text>

    <text x="90" y="206" class="row-label">Customers</text>
    <text x="550" y="206" text-anchor="end" class="row-value">6</text>
    <line x1="80" y1="230" x2="560" y2="230" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="90" y="270" class="row-label">Delivery FTEs</text>
    <text x="550" y="270" text-anchor="end" class="row-value">180</text>
    <line x1="80" y1="294" x2="560" y2="294" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="90" y="334" class="row-label">Delivery cost</text>
    <text x="550" y="334" text-anchor="end" class="row-value">$18M</text>
    <line x1="80" y1="358" x2="560" y2="358" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="90" y="398" class="row-label">Revenue (6 customers)</text>
    <text x="550" y="398" text-anchor="end" class="row-value">$30M</text>

    <rect x="80" y="422" width="480" height="54" rx="8" fill="#EEF1F3"/>
    <text x="100" y="456" class="row-label" style="font-weight:600;">Contribution</text>
    <text x="550" y="458" text-anchor="end" class="row-value-hi-t">$12M</text>
  </g>

  <!-- AI-native panel -->
  <g filter="url(#shadow)">
    <rect x="620" y="110" width="520" height="380" rx="18" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <path d="M620,128 a18,18 0 0 1 18,-18 h484 a18,18 0 0 1 18,18 v38 h-520 z" fill="#1F5F5B"/>
    <text x="880" y="153" text-anchor="middle" class="panel-head">AI-Native Shared Model</text>

    <text x="650" y="206" class="row-label">Customers</text>
    <text x="1110" y="206" text-anchor="end" class="row-value">6</text>
    <line x1="640" y1="230" x2="1120" y2="230" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="650" y="270" class="row-label">Delivery FTEs + platform</text>
    <text x="1110" y="270" text-anchor="end" class="row-value">~60 + $1.5M</text>
    <line x1="640" y1="294" x2="1120" y2="294" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="650" y="334" class="row-label">Delivery cost</text>
    <text x="1110" y="334" text-anchor="end" class="row-value">$7.5M</text>
    <line x1="640" y1="358" x2="1120" y2="358" stroke="#E5E7EB" stroke-width="1.5"/>

    <text x="650" y="398" class="row-label">Revenue (6 customers)</text>
    <text x="1110" y="398" text-anchor="end" class="row-value">$30M</text>

    <rect x="640" y="422" width="480" height="54" rx="8" fill="#E7F2F0"/>
    <text x="660" y="456" class="row-label" style="font-weight:600;">Contribution</text>
    <text x="1110" y="458" text-anchor="end" class="row-value-hi-a">$22.5M</text>
  </g>

  <text x="600" y="512" text-anchor="middle" class="caption">Same 6 customers. Same $30M revenue. Delivery cost cut from $18M to $7.5M.</text>

  <!-- Flywheel -->
  <text x="600" y="556" text-anchor="middle" class="flywheel-title">The operating-leverage flywheel</text>
  <text x="600" y="583" text-anchor="middle" class="subtitle">Some of the freed cost curve is returned as pricing, which wins volume</text>
  <text x="600" y="605" text-anchor="middle" class="subtitle">and compounds the platform's own learning.</text>

  <circle cx="600" cy="1060" r="380" fill="none" stroke="#D7DCE2" stroke-width="1.5" stroke-dasharray="2 8"/>

  <!-- connectors -->
  <path d="M721.24,750.0 L807.85,800.0" class="arrow-path" fill="none" stroke="#4c627a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M929.09,1010 L929.09,1110" fill="none" stroke="#4c627a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M807.85,1320 L721.24,1370" fill="none" stroke="#4c627a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M478.76,1370 L392.15,1320" fill="none" stroke="#4c627a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M270.91,1110 L270.91,1010" fill="none" stroke="#4c627a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M392.15,800 L478.76,750" fill="none" stroke="#4c627a" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- center -->
  <circle cx="600" cy="1060" r="76" fill="#123F3C"/>
  <text x="600" y="1052" text-anchor="middle" class="center-text">Shared</text>
  <text x="600" y="1072" text-anchor="middle" class="center-text">AI-native</text>
  <text x="600" y="1092" text-anchor="middle" class="center-text">platform</text>

  <!-- Node 1: top -->
  <g filter="url(#shadow)">
    <rect x="485" y="620" width="230" height="120" rx="16" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <circle cx="511" cy="646" r="14" fill="#1F5F5B"/>
    <text x="511" y="651" text-anchor="middle" class="node-num">1</text>
    <text x="600" y="688" text-anchor="middle" class="node-text">Lower unit cost</text>
  </g>

  <!-- Node 2: upper right -->
  <g filter="url(#shadow)">
    <rect x="814.09" y="810" width="230" height="120" rx="16" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <circle cx="840.09" cy="836" r="14" fill="#1F5F5B"/>
    <text x="840.09" y="841" text-anchor="middle" class="node-num">2</text>
    <text x="929.09" y="868" text-anchor="middle" class="node-text">More competitive</text>
    <text x="929.09" y="888" text-anchor="middle" class="node-text">pricing</text>
  </g>

  <!-- Node 3: lower right -->
  <g filter="url(#shadow)">
    <rect x="814.09" y="1190" width="230" height="120" rx="16" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <circle cx="840.09" cy="1216" r="14" fill="#1F5F5B"/>
    <text x="840.09" y="1221" text-anchor="middle" class="node-num">3</text>
    <text x="929.09" y="1248" text-anchor="middle" class="node-text">More customer</text>
    <text x="929.09" y="1268" text-anchor="middle" class="node-text">wins</text>
  </g>

  <!-- Node 4: bottom -->
  <g filter="url(#shadow)">
    <rect x="485" y="1380" width="230" height="120" rx="16" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <circle cx="511" cy="1406" r="14" fill="#1F5F5B"/>
    <text x="511" y="1411" text-anchor="middle" class="node-num">4</text>
    <text x="600" y="1438" text-anchor="middle" class="node-text">More volume</text>
    <text x="600" y="1458" text-anchor="middle" class="node-text">through the platform</text>
  </g>

  <!-- Node 5: lower left -->
  <g filter="url(#shadow)">
    <rect x="155.91" y="1190" width="230" height="120" rx="16" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <circle cx="181.91" cy="1216" r="14" fill="#1F5F5B"/>
    <text x="181.91" y="1221" text-anchor="middle" class="node-num">5</text>
    <text x="270.91" y="1248" text-anchor="middle" class="node-text">More operational</text>
    <text x="270.91" y="1268" text-anchor="middle" class="node-text">learning</text>
  </g>

  <!-- Node 6: upper left -->
  <g filter="url(#shadow)">
    <rect x="155.91" y="810" width="230" height="120" rx="16" fill="#ffffff" stroke="#1F5F5B" stroke-width="2"/>
    <circle cx="181.91" cy="836" r="14" fill="#1F5F5B"/>
    <text x="181.91" y="841" text-anchor="middle" class="node-num">6</text>
    <text x="270.91" y="858" text-anchor="middle" class="node-text">Greater elimination,</text>
    <text x="270.91" y="878" text-anchor="middle" class="node-text">prevention &amp; agentic</text>
    <text x="270.91" y="898" text-anchor="middle" class="node-text">coverage</text>
  </g>

  <text x="600" y="1545" text-anchor="middle" class="foot">Each turn compounds: lower cost funds pricing, pricing wins volume, volume deepens learning,</text>
  <text x="600" y="1567" text-anchor="middle" class="foot">learning expands what's eliminated, prevented and agent-handled — which lowers cost again.</text>
</svg>
