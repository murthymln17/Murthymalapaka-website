<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="Business signals lead and history decides the action" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a988f"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">Business signals lead and history decides the action</text>

  <g fill="none" stroke="#9a988f" stroke-width="1.25">
    <path d="M130.5 136V176" marker-end="url(#arrow)"/>
    <path d="M367.5 136V176" marker-end="url(#arrow)"/>
    <path d="M604.5 136V176" marker-end="url(#arrow)"/>
    <path d="M130.5 248V288" marker-end="url(#arrow)"/>
